<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Blonde Pigtails -->
  <circle cx="150" cy="220" r="50" fill="url(#hairGrad)" />
  <circle cx="362" cy="220" r="50" fill="url(#hairGrad)" />
  <!-- Hair Flowers -->
  <circle cx="170" cy="190" r="18" fill="#f43f5e" />
  <circle cx="170" cy="190" r="8" fill="#fef08a" />
  <circle cx="342" cy="190" r="18" fill="#facc15" />
  <circle cx="342" cy="190" r="8" fill="#fb7185" />
  <!-- Head Face -->
  <circle cx="256" cy="260" r="110" fill="#fde68a" />
  <!-- Hair front bangs -->
  <path d="M 156 220 Q 256 160 356 220 Q 256 210 156 220 Z" fill="url(#hairGrad)" />
  <!-- Big Blue Eyes -->
  <circle cx="215" cy="255" r="16" fill="#38bdf8" />
  <circle cx="217" cy="253" r="6" fill="#0284c7" />
  <circle cx="221" cy="250" r="4" fill="#ffffff" />
  <circle cx="297" cy="255" r="16" fill="#38bdf8" />
  <circle cx="299" cy="253" r="6" fill="#0284c7" />
  <circle cx="303" cy="250" r="4" fill="#ffffff" />
  <!-- Rosy Cheeks -->
  <circle cx="190" cy="285" r="14" fill="#f43f5e" opacity="0.4" />
  <circle cx="322" cy="285" r="14" fill="#f43f5e" opacity="0.4" />
  <!-- Sweet Smile -->
  <path d="M 230 290 Q 256 315 282 290" fill="none" stroke="#be185d" stroke-width="6" stroke-linecap="round" />
  <!-- Dress collar & Cherries -->
  <path d="M 200 370 Q 256 400 312 370 L 330 460 Q 256 480 182 460 Z" fill="#fbcfe8" />
  <!-- Cherries pattern on dress -->
  <circle cx="240" cy="420" r="8" fill="#e11d48" />
  <circle cx="254" cy="424" r="8" fill="#e11d48" />
  <path d="M 240 420 Q 250 405 252 400" fill="none" stroke="#15803d" stroke-width="3" />
  <path d="M 254 424 Q 252 405 252 400" fill="none" stroke="#15803d" stroke-width="3" />
</svg>
